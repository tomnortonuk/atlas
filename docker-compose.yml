version: '3.8'

services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=/app/data/atlas.db
      - JWT_SECRET=change-this-secret-in-production
    restart: unless-stopped
